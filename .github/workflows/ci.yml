name: CI

on:
  push:
    branches: [williamos]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build # before the unit tests: tests/unit/hosting.test.ts checks dist/
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - run: npx lhci autorun
      - run: npx linkinator . --server-root dist --recurse --skip "williamdev\\.is-a\\.dev" --skip "linkedin\\.com" --skip "github\\.com" --skip "wyngaardenpastries"
